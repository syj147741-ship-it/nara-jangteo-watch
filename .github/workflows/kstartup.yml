name: K-Startup 사업공고 수집
on:
  schedule:
    # KST 매일 새벽 04:37 = UTC 19:37 (전날). GitHub 예약 실행은 몇 시간 늦어질 수 있어 새벽으로 당겨 둠
    - cron: "37 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kstartup
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        env:
          KSTARTUP_SERVICE_KEY: ${{ secrets.KSTARTUP_SERVICE_KEY || secrets.NARA_SERVICE_KEY }}
          TZ: Asia/Seoul
        run: python scripts/kstartup.py
      - name: 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/kstartup
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): K-Startup 공고 수집"
          # 나라장터 수집과 같은 시각에 push 하면 거절될 수 있어 최대 3번 다시 시도
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
